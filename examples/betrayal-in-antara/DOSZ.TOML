# Example: a Windows 95 game installed under an OS image.
#
# The source directory beside this manifest holds:
#   SIERRA/ANTARA/...        the game as Setup installed it, unmodified
#                            (extracted with `doszer install --drive c`)
#   *.iso                    the three game discs
#
# Everything that differs from the raw install is declared here: trim
# drops Setup's leftovers, flatten moves the game to D:\ANTARA, and the
# rewrites fix its install path and settings in RESOURCE.WIN.
# Paths in rewrite rules and [[file]] are as they are after flatten.

format = 1
name   = 'Betrayal in Antara'
notes  = """
Windows 95 game (Sierra, 1997), run under the Win98 OS image.

Source: SIERRA/ANTARA is Setup's default install from Disc 1 under
Windows 98 (Setup fails installing anywhere else), extracted from C: with
`doszer install --drive c`. flatten turns it into D:\\ANTARA, where
WINDOWS.BAT starts the game. Setup's registry entries and C:\\WINDOWS
changes aren't needed.

RESOURCE.WIN: Setup writes DirectDraw off and a fixed-size window; the
rewrites below turn both on, and maximize the window without a title bar.

Display: the game wants exactly 256 colours (it warns at more), so
WINDOWS.BAT switches the desktop to 640x480x8 first; maximized, the game
then fills the screen.
"""

[boot]
os = 'dosbox_pure/Win98'

[layout]
trim = [
  "SIERRA/*",         # Sierra Setup's own files: setup/uninstall, registration,
                      # Smacker DLLs for its billboards, test MIDIs
  "**/RESOURCE.IN~",  # Setup's backup of RESOURCE.WIN
  "**/SIERRA.INF",    # Setup and uninstall data; the game never reads it
  "**/LANGUAGE.INF",  # Setup and Program Manager strings
  "**/ANTARA.ICO",    # Program Manager icon
  "**/README.TXT",
]
flatten = true

# Setup records the install folder as an extra search path for 3D data.
[[layout.rewrite]]
from  = 'C:\SIERRA\Antara'
to    = 'D:\ANTARA'
files = ["ANTARA/RESOURCE.WIN"]

# Draw through DirectDraw rather than GDI.
[[layout.rewrite]]
from  = 'useDirectDraw=FALSE'
to    = 'useDirectDraw=TRUE'
files = ["ANTARA/RESOURCE.WIN"]

# Let the game window be resized.
[[layout.rewrite]]
from  = 'AllowResize=FALSE'
to    = 'AllowResize=TRUE'
files = ["ANTARA/RESOURCE.WIN"]

# Start maximized, without a title bar. Setup writes no maximized key, so
# it's added after titleBar. ANTARAR.EXE also reads allowTrueColor, which
# only silences the 256-colour warning.
[[layout.rewrite]]
from  = 'titleBar=TRUE'
to    = "titleBar=FALSE\r\nmaximized=TRUE"
files = ["ANTARA/RESOURCE.WIN"]

# Run at startup by the OS image, which shuts Windows down when it ends
# (specification §12). QUICKRES_RUNDLLENTRY is Windows 98's own display
# mode switch (DESKCP16.DLL, a 16-bit DLL, so RUNDLL, not RUNDLL32). START
# /W makes each step wait: from a batch file, Windows programs otherwise
# run in the background.
[[file]]
path = 'WINDOWS.BAT'
text = '''
@ECHO OFF
START /W RUNDLL DESKCP16.DLL,QUICKRES_RUNDLLENTRY 640x480x8
D:
CD \ANTARA
START /W ANTARAR.EXE
'''

# Gamepad mapping, from the game's own hotkey list (ANTARA.HLP, "Hot
# Keys"). The game is played with the mouse: the right stick moves it,
# A and R2 click, L2 right-clicks (item and building descriptions). The
# left stick walks (arrow keys: forward/back, turn), the d-pad also
# slides sideways (Insert/Page Up). Hotkeys are context-dependent: S opens
# the camping screen (rest/sleep) when exploring but sets Swing in combat.
# Combat is otherwise driven by its on-screen buttons. A Steam Deck's back
# buttons aren't RetroPad controls; bind them in Steam Input, e.g. to LB
# and RB.
[[input.pad]]
lstick_up    = "up Forward"
lstick_down  = "down Backward"
lstick_left  = "left Turn Left"
lstick_right = "right Turn Right"
up           = "up Forward"
down         = "down Backward"
left         = "insert Slide Left"
right        = "pageup Slide Right"
rstick_left  = "mouse_move_left"
rstick_right = "mouse_move_right"
rstick_up    = "mouse_move_up"
rstick_down  = "mouse_move_down"
b            = "mouse_left_click Click"
r2           = "mouse_left_click Click"
l2           = "mouse_right_click Describe"
a            = "esc Back"
y            = "p Control Panel"
x            = "m Map"
l            = "s Camp / Swing"
r            = "wheel"
r3           = "c Cast Spell"
select       = "q Quicksave"
start        = "o Options"
l3           = "menu"
wheel        = [
  "leftctrl+w William's Inventory",
  "leftctrl+a Aren's Inventory",
  "leftctrl+k Kaelyn's Inventory",
  "leftctrl+r Raal's Inventory",
  "l Spell Creation",
  "f Flashbacks",
  "leftctrl+s Save Game",
  "leftctrl+l Load Game",
]

